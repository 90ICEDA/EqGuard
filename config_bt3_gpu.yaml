model:
  in_channels: 39
  hidden_channels: 64
  out_channels: 2
  num_layers: 4

train:
  lr: 0.0001
  weight_decay: 0.001
  epochs: 100
  train_mode: 4
  seed_id : 42
  thr_strategy: "fpr_first"
  device: "cuda:0"

siamese:
  lambda_const: 1.0
  lambda_det: 1.4
  lambda_nor: 0.0
  lambda_pos: 0.0
  trojan_w: 6.0
  const_mode: "mse_logit"
  loss_type: "ce"
  # threshold: 0.5
  # warmup_ratio: 0.3

view:
  budget: 4

data:
  orig_path: "./data/processed/orig_graph.pt"
  trans_path: "./data/processed/trans_graph.pt"
